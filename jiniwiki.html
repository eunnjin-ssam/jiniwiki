<title>지니위키</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 왼쪽 색인(바로가기·업무 분류) + 오른쪽 카드 영역. 휴대폰에서는 위쪽 검색줄 + 가로 색인 */
@font-face{font-family:"Pretendard";font-weight:45 920;font-style:normal;font-display:swap;
  src:local("Pretendard Variable"),url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2");}
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunken:#f1f3f5; --hover:#f4f6f9;
  --ink:#191f28; --ink2:#333d4b; --muted:#6b7684; --faint:#8b95a1;
  --line:#e5e8eb; --line2:#d1d6db;
  --accent:#2f5fd0; --accent-ink:#ffffff; --accent-soft:#edf2fd; --accent-line:#c7d6f7;
  --warn:#c9372c; --warn-soft:#fdf0ef; --ok:#1d7f57;
  --c-homeroom:#2f7fc1; --c-g6:#b4417a; --c-dept:#1d8a6a; --c-admin:#7357c4; --c-class:#c0791d; --c-qa:#c9372c;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 4px 14px rgba(17,24,39,.06);
  --f:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r:12px; --logo-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b21; --sunken:#1d2229; --hover:#1f252d;
  --ink:#eef1f4; --ink2:#cfd5dc; --muted:#929ca8; --faint:#6f7984;
  --line:#272d35; --line2:#363e48;
  --accent:#7097f4; --accent-ink:#0d1320; --accent-soft:#1a2440; --accent-line:#2c3d66;
  --warn:#f07b70; --warn-soft:#351d1b; --ok:#5cc497;
  --c-homeroom:#6fafe6; --c-g6:#ec8bb8; --c-dept:#5cc4a2; --c-admin:#a891ec; --c-class:#e3a556; --c-qa:#f07b70;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --logo-filter:brightness(1.75) saturate(.85);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --sunken:#1d2229; --hover:#1f252d;
  --ink:#eef1f4; --ink2:#cfd5dc; --muted:#929ca8; --faint:#6f7984;
  --line:#272d35; --line2:#363e48;
  --accent:#7097f4; --accent-ink:#0d1320; --accent-soft:#1a2440; --accent-line:#2c3d66;
  --warn:#f07b70; --warn-soft:#351d1b; --ok:#5cc497;
  --c-homeroom:#6fafe6; --c-g6:#ec8bb8; --c-dept:#5cc4a2; --c-admin:#a891ec; --c-class:#e3a556; --c-qa:#f07b70;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --logo-filter:brightness(1.75) saturate(.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.35;letter-spacing:-.02em}
kbd{font-family:var(--f);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface)}

/* 머리줄 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;gap:16px;align-items:center;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);flex-shrink:0;width:214px}
.logo-img{display:block;height:32px;width:auto;max-width:none;filter:var(--logo-filter)}
.search{flex:1;min-width:0;position:relative;max-width:620px}
.search input{width:100%;height:40px;padding:0 44px 0 40px;border:1px solid var(--line);border-radius:10px;background:var(--sunken);font-size:15px;transition:border-color .15s,background .15s}
.search input:focus{background:var(--surface);border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search input::-webkit-search-cancel-button{display:none}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.search input:focus ~ kbd{display:none}
.top .sp{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;height:36px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink2);white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.danger{color:var(--warn);border-color:transparent;background:var(--warn-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* 본문 틀 */
.shell{display:grid;grid-template-columns:214px minmax(0,1fr);gap:32px;max-width:1200px;margin:0 auto;
  padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start;display:flex;flex-direction:column;gap:22px}
.idx-group{display:flex;flex-direction:column;gap:1px}
.idx-label{font-size:12px;color:var(--faint);font-weight:600;padding:0 10px 6px}
.idx a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;text-decoration:none;color:var(--ink2);font-size:14.5px;font-weight:500}
.idx a:hover{background:var(--hover)}
.idx a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.idx a .n{margin-left:auto;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:500}
.idx svg{flex-shrink:0;opacity:.75}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--muted);display:inline-block}
.dot.homeroom{background:var(--c-homeroom)}.dot.g6{background:var(--c-g6)}.dot.dept{background:var(--c-dept)}.dot.admin{background:var(--c-admin)}.dot.class{background:var(--c-class)}.dot.qa{background:var(--c-qa)}
.idx-foot{font-size:12.5px;color:var(--muted);padding:12px 10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.idx-foot b{color:var(--ink2);font-weight:650}

main{min-width:0;display:flex;flex-direction:column;gap:32px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.sec-head h2{font-size:18px;font-weight:700}
.sec-head h2.s{font-size:15px;font-weight:650;color:var(--ink2);display:flex;align-items:center;gap:8px}
.sec-head .sub{color:var(--muted);font-size:13.5px}
.sec-head .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.page-title{display:flex;flex-direction:column;gap:4px}
.page-title h1{font-size:24px;font-weight:750;display:flex;align-items:center;gap:10px}
.page-title p{margin:0;color:var(--muted);font-size:14px}

/* 이번 달 */
.today{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.today-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.today-top .cal{width:52px;height:56px;border-radius:10px;border:1px solid var(--line2);overflow:hidden;display:flex;flex-direction:column;text-align:center;flex-shrink:0;background:var(--surface)}
.today-top .cal span{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:650;line-height:18px}
.today-top .cal b{flex:1;display:grid;place-items:center;font-size:22px;font-weight:750;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.today-top h2{font-size:20px;font-weight:750}
.today-top p{margin:0;color:var(--muted);font-size:13.5px}
.bar{height:6px;border-radius:99px;background:var(--sunken);overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* 카드 목록 */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;min-width:0;transition:border-color .12s,box-shadow .12s}
.card:hover{border-color:var(--line2);box-shadow:var(--shadow)}
.card h3{font-size:15.5px;font-weight:650;display:flex;gap:6px;align-items:flex-start;color:var(--ink)}
.card h3 .t{flex:1;min-width:0}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;height:22px;padding:0 7px;background:var(--sunken);font-size:12px;color:var(--muted);white-space:nowrap;font-weight:500}
.chip.m{background:transparent;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.m.now{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:650}
.chip.ex{background:transparent;border:1px dashed var(--line2);color:var(--faint)}
.chip.tag{background:var(--accent-soft);color:var(--accent);cursor:pointer;border:0}
.chip.tag:hover{filter:brightness(.97)}
.prog{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.prog.full{color:var(--ok)}
.star{color:#e9a400;flex-shrink:0}

/* 월 띠 */
.months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;gap:4px}
.months a{display:flex;flex-direction:column;align-items:center;padding:8px 0 7px;border-radius:8px;text-decoration:none;color:var(--ink2);gap:1px;position:relative}
.months a b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.months a small{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.months a:hover{background:var(--hover)}
.months a.now::after{content:"";position:absolute;top:5px;right:calc(50% - 18px);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.months a.on{background:var(--accent);color:var(--accent-ink)}
.months a.on small{color:var(--accent-ink);opacity:.8}
.months a.on.now::after{background:var(--accent-ink)}
.sems{display:grid;grid-template-columns:1fr 1fr;font-size:12px;color:var(--faint);text-align:center;margin-top:-4px}

.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:32px;padding:0 13px;font-size:13.5px;cursor:pointer;color:var(--ink2);font-weight:500}
.filters button:hover{background:var(--hover)}
.filters button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters button span{opacity:.55;margin-left:3px;font-variant-numeric:tabular-nums}

.empty{border:1px dashed var(--line2);border-radius:12px;padding:26px 20px;color:var(--muted);text-align:center;font-size:14px;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--surface)}

/* 카드 상세 */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:24px;max-width:840px;box-shadow:var(--shadow)}
.doc-head{display:flex;flex-direction:column;gap:12px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none;display:inline-flex;align-items:center;gap:6px}.crumb a:hover{color:var(--accent)}
.doc h1{font-size:26px;font-weight:750;letter-spacing:-.03em}
.lede{font-size:16px;margin:0;color:var(--ink2)}
.block{display:flex;flex-direction:column;gap:10px}
.block h4{font-size:13px;color:var(--muted);font-weight:650;display:flex;align-items:center;gap:8px}
.block h4 .prog{margin-left:0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.checks li+li{border-top:1px solid var(--line)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;cursor:pointer}
.checks label:hover{background:var(--hover)}
.checks input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex-shrink:0}
.checks .done span{color:var(--faint);text-decoration:line-through}
.prose{max-width:70ch;color:var(--ink2)}
.prose p{margin:0 0 8px}.prose ul{margin:0 0 8px;padding-left:20px}.prose li{margin-bottom:2px}
.prose h5{font-size:15px;margin:14px 0 6px;color:var(--ink);font-weight:700}
.prose h5:first-child{margin-top:0}
.prose strong{color:var(--ink);font-weight:650}
.caution{background:var(--warn-soft);border-radius:10px;padding:14px 18px}
.caution h4{color:var(--warn)}
.links{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.links a{text-decoration:none;font-weight:500}.links a:hover{text-decoration:underline}
.stale{color:var(--warn);font-weight:600}
.doc-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:18px;font-size:13px;color:var(--muted)}
.doc-foot .sp{flex:1}
.backq{align-self:flex-start}

/* 편집 */
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lb{font-size:13.5px;font-weight:650;color:var(--ink2)}
.field .hint{font-size:12.5px;color:var(--faint);font-weight:400;margin-left:4px}
.field input[type=text],.field input[type=url],.field input[type=date],.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:96px;resize:vertical;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mpick{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.mpick button{border:1px solid var(--line2);background:var(--surface);border-radius:7px;height:34px;cursor:pointer;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.mpick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.draftnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 웹도구 */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tool h3{font-size:15.5px;font-weight:650;display:flex;gap:10px;align-items:center}
.tool .ico{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:750;font-size:15px;flex-shrink:0}
.tool p{margin:0;color:var(--muted);font-size:13.5px}
.tool code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--sunken);border-radius:6px;padding:3px 7px;word-break:break-all;color:var(--muted);display:inline-block}
.tool .acts{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--accent-line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}

.note{font-size:13.5px;color:var(--ink2);background:var(--accent-soft);border-radius:10px;padding:11px 14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:20;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

@media (max-width:860px){
  .top-in{flex-wrap:wrap;gap:10px;padding-block:10px}
  .brand{width:auto}
  .search{order:3;flex-basis:100%;max-width:none}
  .search kbd{display:none}
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:14px 64px}
  nav.idx{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px}
  nav.idx::-webkit-scrollbar{display:none}
  .idx-group{flex-direction:row;gap:6px}
  .idx-label,.idx-foot,.idx a .n{display:none}
  .idx a{white-space:nowrap;border:1px solid var(--line);background:var(--surface);height:34px;padding:0 12px;font-size:14px}
  .months{grid-template-columns:repeat(6,minmax(0,1fr))}
  .sems{display:none}
  .doc{padding:22px 18px;border-radius:14px}
  .doc h1{font-size:22px}
  .today{padding:18px}
  .row2{grid-template-columns:1fr}
  .mpick{grid-template-columns:repeat(6,minmax(0,1fr))}
  .pathrow,.copybtn{display:none}
  .doc-foot .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="#home" aria-label="지니위키 홈"><img class="logo-img" src="img/jiniwiki-logo.png" alt="jiniwiki" width="105" height="32"></a>
  <div class="search">
    <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="업무 검색  예) 생기부, ㅎㅍ, #나이스" autocomplete="off" enterkeyhint="search" aria-label="지니위키 검색">
    <kbd>/</kbd>
  </div>
  <span class="sp"></span>
  <a class="btn primary" href="#new" id="newBtn" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>새 카드</a>
</div></header>

<div class="shell">
  <nav class="idx" id="nav" aria-label="분류"></nav>
  <main id="main"><div class="empty">지니위키를 여는 중이에요…</div></main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
const CATS = [
  {id:'homeroom', name:'담임업무', subs:['학년초·학기초','학급운영','학부모·상담','생활지도','평가·생활기록부','학기말·학년말']},
  {id:'g6', name:'6학년 부장', subs:['중학교 입학','졸업','학년 운영','행사·체험학습']},
  {id:'dept', name:'부서업무', subs:['학년부장','교무(학적·학사·생기부)','연구(교육과정·연수)','학생평가','생활인성·학교폭력','생태환경']},
  {id:'admin', name:'행정·복무', subs:['나이스','K-에듀파인·공문','복무(연가·출장)','연수·성과급·인사']},

// 초성 검색
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function choseong(str){ let o=''; for (const ch of str){ const c=ch.charCodeAt(0); o += (c>=0xAC00 && c<=0xD7A3) ? CHO[Math.floor((c-0xAC00)/588)] : ch; } return o; }
const isChoOnly = q => /^[ㄱ-ㅎ\s]+$/.test(q);

function cardText(c){ return [c.title,c.summary,c.sub,CAT[c.cat]?.name,(c.tags||[]).join(' '),(c.checklist||[]).join(' '),c.body,c.caution].join(' ').toLowerCase(); }
function searchCards(q){
  q = q.trim(); if (!q) return [];
  const all = [...S.cards.values()];
  if (q.startsWith('#')) { const t=q.slice(1).trim(); return sortCards(all.filter(c => (c.tags||[]).some(x => x.includes(t)))); }
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const scored = [];
  for (const c of all){
    const txt = cardText(c), cho = choseong(txt), title = (c.title||'').toLowerCase();
    let ok = true, score = 0;
    for (const t of terms){
      if (isChoOnly(t)) { if (cho.includes(t)) score += choseong(title).includes(t)?3:1; else { ok=false; break; } }
      else if (txt.includes(t)) score += title.includes(t)?3:1; else { ok=false; break; }
    }
    if (ok) scored.push([score,c]);
  }
  return scored.sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}
function searchTools(q){
  q=q.trim().toLowerCase(); if(!q || q.startsWith('#')) return [];
  return S.tools.filter(t => { const s=[t.name,t.desc,t.cat].join(' ').toLowerCase(); return isChoOnly(q) ? choseong(s).includes(q.replace(/\s+/g,'')) : s.includes(q); });
}

function sortCards(arr){ return arr.sort((a,b) => (b.fav?1:0)-(a.fav?1:0) || (a.title||'').localeCompare(b.title||'','ko')); }
const byMonth = m => sortCards([...S.cards.values()].filter(c => (c.months||[]).includes(m)));
const always = () => sortCards([...S.cards.values()].filter(c => !(c.months||[]).length));
function doneCount(c){ const n=(c.checklist||[]).length; return [((c.done||{})[SY]||[]).filter(i=>i<n).length, n]; }

function monthChips(c){
  const ms = c.months||[];
  if (!ms.length) return '<span class="chip m">상시</span>';
  return SCHOOL_MONTHS.filter(m=>ms.includes(m)).map(m => `<span class="chip m${m===curM?' now':''}">${m}월</span>`).join('');
}
function progress(c){
  const [d,n] = doneCount(c); if(!n) return '';
  return `<span class="prog${d===n?' full':''}">${d===n?'✓ ':''}${d}/${n}</span>`;
}
function cardItem(c){

  </button>`;
}
function cardList(arr, emptyHtml){ return arr.length ? `<div class="list">${arr.map(cardItem).join('')}</div>` : (emptyHtml ? `<div class="empty">${emptyHtml}</div>` : ''); }

function statusNote(){

/* 간단한 서식: ## 소제목, - 목록, **굵게**, 주소 자동 연결 */
function prose(text){
  if (!text) return '';
  const cardLink = (m, t) => { const c=[...S.cards.values()].find(x=>x.title===t.trim()); return c ? `<a href="#card-${esc(c.id)}">${t}</a>` : `<span title="이 제목의 카드가 아직 없어요" style="border-bottom:1px dashed var(--faint)">${t}</span>`; };
  const inline = s => esc(s).replace(/\[\[(.+?)\]\]/g, cardLink).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  let out='', list=false;
  for (const raw of text.split('\n')){
    const l = raw.trimEnd();
    if (/^\s*[-•·]\s+/.test(l)){ if(!list){out+='<ul>';list=true;} out+=`<li>${inline(l.replace(/^\s*[-•·]\s+/,''))}</li>`; continue; }
    if (list){ out+='</ul>'; list=false; }
    if (/^##\s+/.test(l)) out+=`<h5>${inline(l.replace(/^##\s+/,''))}</h5>`;
    else if (l.trim()) out+=`<p>${inline(l)}</p>`;
  }
  if (list) out+='</ul>';
  return out;
}

  const c = id ? S.cards.get(id) : null;

  const base = c || S.dupFrom || { title:preset.q||'', cat:preset.cat||'homeroom', sub:'', months:preset.m?[preset.m]:[], tags:[], summary:'', checklist:[], body:'', caution:'', links:[] };
  const v = c ? base : {...base, checkedAt: todayStr()};
  const draft = store.get(draftKey(id));
  S.mpick = [...(v.months||[])];
  const subs = CAT[v.cat]?.subs || [];
  return `<article class="doc">
  <div class="doc-head"><div class="crumb"><a href="${c?'#card-'+esc(c.id):'#home'}" data-act="cancel">← ${c?'카드로 돌아가기':'홈으로'}</a></div><h1>${c?'카드 고치기':S.dupFrom?'복제해서 새 카드':'새 카드'}</h1>
  ${draft?`<div class="note draftnote">저장하지 않고 나간 내용이 있어요 (${esc(draft.at)}). <button type="button" class="btn sm" data-act="draftload">불러오기</button><button type="button" class="btn sm ghost" data-act="draftdrop">버리기</button></div>`:''}</div>
  <form class="form" id="cardForm" data-id="${esc(id||'')}">
    <div class="field"><label for="f-title">제목</label><input type="text" id="f-title" required value="${esc(v.title)}" placeholder="예: 학기 초 학부모 상담 주간 준비"></div>
    <div class="row2">
      <div class="field"><label for="f-cat">분류</label><select id="f-cat">${CATS.map(x=>`<option value="${x.id}" ${x.id===v.cat?'selected':''}>${x.name}</option>`).join('')}</select></div>
      <div class="field"><label for="f-sub">세부 분류<span class="hint">목록에 없으면 직접 입력</span></label><input type="text" id="f-sub" list="f-subs" value="${esc(v.sub)}"><datalist id="f-subs">${subs.map(s=>`<option value="${esc(s)}">`).join('')}</datalist></div>
    </div>
    <div class="field"><span class="lb">시기<span class="hint">하는 달을 모두 고르세요. 고르지 않으면 ‘상시’ 업무</span></span>
      <div class="mpick" id="mpick">${SCHOOL_MONTHS.map(m=>`<button type="button" data-m="${m}" class="${S.mpick.includes(m)?'on':''}" aria-pressed="${S.mpick.includes(m)}">${m}월</button>`).join('')}</div></div>
    <div class="field"><label for="f-summary">한 줄 요약</label><input type="text" id="f-summary" value="${esc(v.summary)}" placeholder="이 카드를 한 문장으로"></div>
    <div class="field"><label for="f-check">체크리스트<span class="hint">한 줄에 하나씩, 하는 순서대로</span></label><textarea id="f-check" rows="5">${esc((v.checklist||[]).join('\n'))}</textarea></div>
    <div class="field"><label for="f-body">자세한 절차·방법<span class="hint">‘## ’ 소제목 · ‘- ’ 목록 · **굵게** · [[카드 제목]] 다른 카드로 연결</span></label><textarea id="f-body" rows="8">${esc(v.body)}</textarea></div>
    <div class="field"><label for="f-caution">주의할 점<span class="hint">예전에 실수했던 것, 헷갈렸던 것</span></label><textarea id="f-caution" rows="3">${esc(v.caution)}</textarea></div>
    <div class="field"><label for="f-links">관련 링크<span class="hint">한 줄에 하나씩 ‘이름 | 주소’</span></label><textarea id="f-links" rows="3" placeholder="학교폭력 사안처리 가이드북 | https://...">${esc((v.links||[]).map(l=>l.label&&l.label!==l.url?`${l.label} | ${l.url}`:l.url).join('\n'))}</textarea></div>
    <div class="row2">
      <div class="field"><label for="f-tags">태그<span class="hint">쉼표로 구분</span></label><input type="text" id="f-tags" value="${esc((v.tags||[]).join(', '))}" placeholder="나이스, 공문, 헷갈림"></div>
      <div class="field"><label for="f-checked">마지막 확인일<span class="hint">이 정보가 언제 기준인지</span></label><input type="date" id="f-checked" value="${esc(v.checkedAt||'')}"></div>
    </div>
    <div class="doc-foot">
      ${c?(S.confirmDel===c.id?`<span class="stale">이 카드를 지울까요? 되돌릴 수 없어요.</span><button type="button" class="btn sm danger" data-act="delyes">지우기</button><button type="button" class="btn sm" data-act="delno">취소</button>`:`<button type="button" class="btn sm danger" data-act="del">카드 지우기</button>`):''}
      <span class="sp"></span>
      <span style="font-size:12.5px;color:var(--faint)"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 저장</span>
      <button type="button" class="btn" data-act="cancel">취소</button>
      <button type="submit" class="btn primary" id="saveBtn">저장</button>
    </div>
  </form></article>`;
}

/* ---------- 웹도구 ---------- */
function toolItem(t){
  const ini = (t.name||'?').trim().slice(0,1);
  return `<div class="tool">
    <h3><span class="ico">${esc(ini)}</span><span style="min-width:0;flex:1">${esc(t.name)}</span>${t.fav?'<span class="star">★</span>':''}</h3>
    ${t.desc?`<p>${esc(t.desc)}</p>`:''}
    ${t.path?`<div class="pathrow"><code title="내 컴퓨터 폴더">${esc(t.path)}</code></div>`:''}
    <div class="acts">
      <span class="chip">${esc(t.cat||'업무')}</span>
      <span style="flex:1"></span>
      ${t.path?`<button class="btn sm ghost copybtn" data-copy="${esc(t.path)}">경로 복사</button>`:''}
      ${S.canWrite&&route()==='tools'?`<button class="btn sm ghost" data-tool-edit="${esc(t.id)}">고치기</button>`:''}
      ${t.url?`<a class="btn sm primary" href="${esc(t.url)}" target="_blank" rel="noopener">열기 ↗</a>`:`<span class="chip ex" title="인터넷 주소를 넣으면 열기 버튼이 생겨요">주소 없음</span>`}
    </div>
  </div>`;
}
function toolForm(){
  const t = S.toolEdit==='new' ? {name:'',desc:'',url:'',path:'',cat:'업무',fav:false} : S.tools.find(x=>x.id===S.toolEdit);
  if (!t) return '';
  return `<div class="panel"><form class="form" id="toolForm">
    <h3 style="font-size:16px;font-weight:700">${S.toolEdit==='new'?'웹도구 등록':'웹도구 고치기'}</h3>
    <div class="row2">
      <div class="field"><label for="t-name">이름</label><input type="text" id="t-name" required value="${esc(t.name)}"></div>
      <div class="field"><label for="t-cat">구분</label><select id="t-cat">${TOOL_CATS.map(c=>`<option ${c===t.cat?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label for="t-desc">설명<span class="hint">언제, 무엇에 쓰는지</span></label><input type="text" id="t-desc" value="${esc(t.desc)}"></div>
    <div class="field"><label for="t-url">인터넷 주소<span class="hint">웹에 올려 둔 경우</span></label><input type="url" id="t-url" value="${esc(t.url)}" placeholder="https://"></div>
    <div class="field"><label for="t-path">내 컴퓨터 폴더<span class="hint">파일로만 있는 경우</span></label><input type="text" id="t-path" value="${esc(t.path)}"></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="t-fav" ${t.fav?'checked':''}> 홈 화면 앞쪽에 보이기</label>
    <div class="doc-foot">
      ${S.toolEdit!=='new'?(S.confirmDel===t.id?`<span class="stale">지울까요?</span><button type="button" class="btn sm danger" data-act="tdelyes">지우기</button><button type="button" class="btn sm" data-act="delno">취소</button>`:`<button type="button" class="btn sm danger" data-act="tdel">지우기</button>`):''}
      <span class="sp"></span><button type="button" class="btn" data-act="tcancel">취소</button><button type="submit" class="btn primary">저장</button>
    </div>
  </form></div>`;
}
function viewTools(){
  const groups = TOOL_CATS.map(c=>[c, S.tools.filter(t=>(t.cat||'업무')===c).sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||a.name.localeCompare(b.name,'ko'))]).filter(g=>g[1].length);
  return `${statusNote()}
  <div class="sec-head"><div class="page-title"><h1>내 웹도구</h1><p>직접 만든 도구 ${S.tools.length}개</p></div><span class="act">${S.downloads?`<button class="btn sm ghost" data-act="backup">전체 백업 받기</button>`:''}${S.canWrite?`<button class="btn sm" data-tool-edit="new">+ 웹도구 등록</button>`:''}</span></div>
  ${S.toolEdit?toolForm():''}
  ${groups.length?groups.map(([c,arr])=>`<section class="sec"><div class="sec-head"><h2 class="s">${c}</h2></div><div class="tools">${arr.map(toolItem).join('')}</div></section>`).join(''):`<div class="empty">등록된 웹도구가 없어요.</div>`}`;
}

/* ---------- 라우팅 ---------- */
function route(){ return (location.hash||'#home').slice(1) || 'home'; }
const isEditRoute = r => r.startsWith('edit-') || r.startsWith('new');
function render(force){
  const r = route();
  renderNav(r);
  $('#newBtn').hidden = !S.canWrite;
  // 입력 중인 내용은 데이터가 새로 와도 지우지 않음
  if (!force && main.dataset.r===r && (main.querySelector('#cardForm') || main.querySelector('#toolForm'))) return;
  let html;
  if (S.query.trim() && !isEditRoute(r)) html = viewSearch(S.query);
  else if (r==='home') html = viewHome();
  else if (r.startsWith('month')) { const m=parseInt(r.split('-')[1],10); html = viewMonth(m>=1&&m<=12?m:curM); }
  else if (r.startsWith('cat-')) html = viewCat(r.slice(4));
  else if (r==='fav') html = viewFav();
  else if (r==='tools') html = viewTools();
  else if (r.startsWith('card-')) html = viewCard(r.slice(5));
  else if (r.startsWith('edit-')) html = viewEdit(r.slice(5), {});
  else if (r.startsWith('new')) { const p=r.slice(4); html = viewEdit(null, p.startsWith('m')?{m:+p.slice(1)}:p.startsWith('c')?{cat:p.slice(1)}:{q:S.newQ||''}); }
  else html = viewHome();
  main.innerHTML = html; main.dataset.r = (main.querySelector('#cardForm')||main.querySelector('#toolForm')) ? r : '';
}
function rerender(){ render(true); }
window.addEventListener('hashchange', () => {
  const r = route();
  S.confirmDel=null; S.toolEdit=null;
  if (r.startsWith('card-')) { if (S.query.trim()) S.lastQuery = S.query; }
  else S.lastQuery = '';
  if (!r.startsWith('new')) { S.dupFrom = null; S.newQ = ''; }
  if (S.query) { S.query=''; $('#q').value=''; }
  rerender(); window.scrollTo(0,0);
});

const q = $('#q');
let qt; q.addEventListener('input', e => { clearTimeout(qt); qt=setTimeout(()=>{ S.query=e.target.value; rerender(); },120); });
q.addEventListener('keydown', e => {
  if (e.key==='Escape'){ q.value=''; S.query=''; rerender(); q.blur(); }
  if (e.key==='Enter'){ const f=main.querySelector('.card'); if(f && S.query.trim()){ q.blur(); f.click(); } }
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if (e.key==='/' && !typing){ e.preventDefault(); q.focus(); q.select(); }
  if (e.key==='Enter' && (e.ctrlKey||e.metaKey) && main.querySelector('#cardForm')){ e.preventDefault(); main.querySelector('#cardForm').requestSubmit(); }
});

/* ---------- 편집 임시 저장 ---------- */
let dt;
main.addEventListener('input', e => {
  const form = e.target.closest('#cardForm'); if (!form) return;
  clearTimeout(dt); dt = setTimeout(() => saveDraft(form), 400);
});
function saveDraft(form){
  const d = { at: new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}), months:[...S.mpick] };
  for (const f of FIELDS) d[f] = form.querySelector('#'+f)?.value ?? '';
  store.set(draftKey(form.dataset.id), d);
}
function loadDraft(form){
  const d = store.get(draftKey(form.dataset.id)); if (!d) return;
  for (const f of FIELDS) { const el=form.querySelector('#'+f); if (el && d[f]!==undefined) el.value=d[f]; }
  S.mpick = d.months||[];
  form.querySelectorAll('#mpick [data-m]').forEach(b => { const on=S.mpick.includes(+b.dataset.m); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  main.querySelector('.draftnote')?.remove();
  toast('저장하지 않았던 내용을 불러왔어요.');
}

/* ---------- 쓰기 ---------- */
const queues = {};
function write(path, fn){
  const p = (queues[path]||Promise.resolve()).then(fn).catch(e => { toast(e && e.code==='quota_exceeded' ? '저장 공간이 가득 찼어요. 쓰지 않는 카드를 지워 주세요.' : '저장하지 못했어요. 잠시 후 다시 해 주세요.'); throw e; });
  queues[path] = p.catch(()=>{}); return p;
}
const cardRef = id => S.db.collection('cards').doc(id);
const toolRef = id => S.db.collection('tools').doc(id);

main.addEventListener('click', async e => {
  const go = e.target.closest('[data-go]'); if (go){ location.hash = go.dataset.go; return; }
  const nq = e.target.closest('[data-newq]'); if (nq){ S.newQ = S.query.trim(); }
  const tag = e.target.closest('[data-tag]'); if (tag){ S.query='#'+tag.dataset.tag; q.value=S.query; S.lastQuery=''; rerender(); window.scrollTo(0,0); return; }
  const sub = e.target.closest('[data-sub]'); if (sub){ S.catSub[route().slice(4)] = sub.dataset.sub; rerender(); return; }
  const mb = e.target.closest('#mpick [data-m]'); if (mb){ const m=+mb.dataset.m; S.mpick = S.mpick.includes(m)?S.mpick.filter(x=>x!==m):[...S.mpick,m]; mb.classList.toggle('on'); mb.setAttribute('aria-pressed', S.mpick.includes(m)); saveDraft(mb.closest('#cardForm')); return; }
  const cp = e.target.closest('[data-copy]'); if (cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); toast('폴더 경로를 복사했어요. 파일 탐색기 주소창에 붙여 넣으세요.'); }catch{ const c=cp.closest('.tool').querySelector('code'); const rg=document.createRange(); rg.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); toast('경로를 선택해 두었어요. Ctrl+C로 복사하세요.'); } return; }
  const te = e.target.closest('[data-tool-edit]'); if (te){ S.toolEdit = te.dataset.toolEdit; S.confirmDel=null; rerender(); main.querySelector('#t-name')?.focus(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, r = route();
  if (act==='clearq'){ S.query=''; q.value=''; rerender(); return; }
  if (act==='backq'){ S.query=S.lastQuery; q.value=S.query; S.lastQuery=''; rerender(); return; }
  if (act==='backup'){ backup(); return; }
  if (act==='delno'){ S.confirmDel=null; rerender(); return; }
  if (act==='tcancel'){ S.toolEdit=null; rerender(); return; }
  if (act==='tdel'){ S.confirmDel=S.toolEdit; rerender(); return; }
  if (act==='tdelyes'){ const id=S.toolEdit; S.toolEdit=null; S.confirmDel=null; try{ await write('tools/'+id, ()=>toolRef(id).delete()); toast('웹도구를 지웠어요.'); }catch{} rerender(); return; }
  const form = main.querySelector('#cardForm');
  if (act==='draftload'){ loadDraft(form); return; }
  if (act==='draftdrop'){ store.del(draftKey(form.dataset.id)); main.querySelector('.draftnote')?.remove(); return; }
  if (act==='cancel'){ e.preventDefault(); store.del(draftKey(form?.dataset.id)); S.dupFrom=null; const id=form?.dataset.id; location.hash = id ? '#card-'+id : '#home'; return; }
  const id = r.startsWith('card-') ? r.slice(5) : r.startsWith('edit-') ? r.slice(5) : null;
  const c = id && S.cards.get(id); if (!c) return;
  if (act==='fav'){ write('cards/'+id, ()=>cardRef(id).update({fav:!c.fav})).catch(()=>{}); return; }
  if (act==='checked'){ write('cards/'+id, ()=>cardRef(id).update({checkedAt:todayStr()})).then(()=>toast('오늘 날짜로 확인일을 바꿨어요.'),()=>{}); return; }
  if (act==='resetck'){ write('cards/'+id, ()=>cardRef(id).update({done:{[SY]:[]}})).catch(()=>{}); return; }
  if (act==='dup'){ const {id:_, fav, done, example, createdAt, updatedAt, checkedAt, ...rest} = c; S.dupFrom = {...rest, title: c.title+' (복사본)'}; location.hash='#new'; return; }
  if (act==='del'){ S.confirmDel=id; rerender(); return; }
  if (act==='delyes'){ S.confirmDel=null; try{ await write('cards/'+id, ()=>cardRef(id).delete()); store.del(draftKey(id)); toast('카드를 지웠어요.'); location.hash='#cat-'+c.cat; }catch{} return; }
});

main.addEventListener('change', e => {
  const ck = e.target.closest('[data-ck]');
  if (ck){
    const id = route().slice(5), c = S.cards.get(id); if (!c) return;
    const set = new Set(((c.done||{})[SY])||[]); const i=+ck.dataset.ck;
    ck.checked ? set.add(i) : set.delete(i);
    ck.closest('label').classList.toggle('done', ck.checked);
    write('cards/'+id, ()=>cardRef(id).update({done:{[SY]:[...set].sort((a,b)=>a-b)}})).catch(()=>{ ck.checked=!ck.checked; ck.closest('label').classList.toggle('done', ck.checked); });
    return;
  }
  if (e.target.id==='f-cat'){
    const subs = CAT[e.target.value]?.subs||[];
    $('#f-subs').innerHTML = subs.map(s=>`<option value="${esc(s)}">`).join('');
    $('#f-sub').value = '';
  }
});

main.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id==='cardForm'){
    const form = e.target, editId = form.dataset.id, id = editId || uid('c');
    const old = S.cards.get(id) || {};
    const lines = s => s.split('\n').map(x=>x.trim()).filter(Boolean);
    const body = {
      title: $('#f-title').value.trim(), cat: $('#f-cat').value, sub: $('#f-sub').value.trim(),
      months: SCHOOL_MONTHS.filter(m=>S.mpick.includes(m)),
      tags: $('#f-tags').value.split(/[,，]/).map(x=>x.trim().replace(/^#/,'')).filter(Boolean),
      summary: $('#f-summary').value.trim(), checklist: lines($('#f-check').value),
      body: $('#f-body').value.trim(), caution: $('#f-caution').value.trim(),
      links: lines($('#f-links').value).map(l=>{ const i=l.lastIndexOf('|'); return i>0?{label:l.slice(0,i).trim(),url:l.slice(i+1).trim()}:{label:l,url:l}; }).filter(l=>/^https?:\/\//.test(l.url)),
      checkedAt: $('#f-checked').value || '', fav: !!old.fav, done: old.done||{}, example:false,
      createdAt: old.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(),
    };
    if (!body.title) return;
    $('#saveBtn').disabled = true;
    try { await write('cards/'+id, ()=>cardRef(id).set(body)); store.del(draftKey(editId)); S.dupFrom=null; S.newQ=''; toast('저장했어요.'); main.dataset.r=''; location.hash = '#card-'+id; }
    catch { $('#saveBtn').disabled = false; }
  }
  if (e.target.id==='toolForm'){
    const id = S.toolEdit==='new' ? uid('t') : S.toolEdit;
    const body = { name:$('#t-name').value.trim(), cat:$('#t-cat').value, desc:$('#t-desc').value.trim(), url:$('#t-url').value.trim(), path:$('#t-path').value.trim(), fav:$('#t-fav').checked, updatedAt:new Date().toISOString() };
    if (!body.name) return;
    try { await write('tools/'+id, ()=>toolRef(id).set(body)); S.toolEdit=null; toast('웹도구를 저장했어요.'); rerender(); } catch {}
  }
});

async function backup(){
  const data = JSON.stringify({ savedAt:new Date().toISOString(), cards:[...S.cards.values()], tools:S.tools }, null, 2);
  try { await S.downloads.save({ filename:`지니위키-백업-${todayStr()}.json`, data }); } catch(e){ if (e && !['declined','dismissed','cancelled'].includes(e.code)) toast('백업 파일을 만들지 못했어요.'); }
}

/* ---------- 시작 ---------- */
render(true);
(async () => {
  const use = n => window.claude?.use ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
  const [db, user, downloads] = await Promise.all([use('db'), use('user'), use('downloads')]);
  S.downloads = downloads;
  if (!db){ S.dbState='none'; rerender(); return; }
  S.db = db;
  if (user){ const cw = await user.can('data.write'); S.canWrite = cw===null ? true : !!cw; } else S.canWrite = true;
  const slow = setTimeout(()=>{ if(S.dbState==='loading'){ S.dbState='slow'; render(); } }, 10000);
  const ready = () => { if (S.loaded.cards && S.loaded.tools && S.dbState!=='ok'){ clearTimeout(slow); S.dbState='ok'; } };
  db.collection('cards').onSnapshot(snap => {
    S.cards = new Map(snap.docs.map(d=>[d.id, {id:d.id, ...d.data()}]));
    if (!snap.metadata.fromCache) S.loaded.cards = true; ready(); render();
  }, () => { clearTimeout(slow); S.dbState='none'; render(); });
  db.collection('tools').onSnapshot(snap => {
    S.tools = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if (!snap.metadata.fromCache) S.loaded.tools = true; ready(); render();
  }, () => { clearTimeout(slow); S.dbState='none'; render(); });
  rerender();
})();
})();
</script>
